version: '3.8'

services:
  identity_db:
    image: postgres:15-alpine
    container_name: identity_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: identity_db
    ports:
      - "5432:5432"
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  inventory_db:
    image: postgres:15-alpine
    container_name: inventory_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: inventory_db
    ports:
      - "5433:5432"
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  global_redis:
    image: redis:7-alpine
    container_name: global_redis_dev
    ports:
      - "6379:6379"
    restart: unless-stopped

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: global_rabbitmq_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped

  auth_db:
    image: postgres:15-alpine
    container_name: auth_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: auth_db
    ports:
      - "5434:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  auth_api:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_api_dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ./auth-service/.env.dev
    environment:
      - DATABASE_URL=postgresql://postgres:123@auth_db:5432/auth_db?schema=public
      - REDIS_HOST=global_redis
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    depends_on:
      - auth_db
      - global_redis
      - rabbitmq

  pgadmin:
    image: dpage/pgadmin4
    container_name: global_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - identity_db
      - inventory_db
      - auth_db
      - notification_db
    restart: unless-stopped

  notification_db:
    image: postgres:15-alpine
    container_name: notification_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: notification_db
    ports:
      - "5435:5432"
    volumes:
      - notification_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  notification_api:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification_api_dev
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_PORT:-3004}:3004"
    env_file:
      - ./notification-service/.env
    environment:
      - DATABASE_URL=postgresql://postgres:123@notification_db:5432/notification_db?schema=public
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    volumes:
      - ./notification-service:/app
      - /app/node_modules
    depends_on:
      - notification_db
      - rabbitmq

  analytics_db:
    image: postgres:15-alpine
    container_name: analytics_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: analytics_db
    ports:
      - "5436:5432"
    volumes:
      - analytics_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  analytics_api:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics_api_dev
    restart: unless-stopped
    ports:
      - "${ANALYTICS_PORT:-3005}:3005"
    env_file:
      - ./analytics-service/.env
    environment:
      - DATABASE_URL=postgresql://postgres:123@analytics_db:5432/analytics_db?schema=public
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    volumes:
      - ./analytics-service:/app
      - /app/node_modules
    depends_on:
      - analytics_db
      - rabbitmq

  mongodb:
    image: mongo:6.0
    container_name: hotel_mongodb_dev
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  mongoexpress:
    image: mongo-express
    container_name: hotel_mongoexpress_dev
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: adminpassword
      ME_CONFIG_MONGODB_URL: mongodb://admin:adminpassword@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: adminpassword
    depends_on:
      - mongodb
    restart: unless-stopped

  operation_api:
    build:
      context: ./operation-service
      dockerfile: Dockerfile
    container_name: operation_api_dev
    restart: unless-stopped
    ports:
      - "3006:3006"
    env_file:
      - ./operation-service/.env
    environment:
      - MONGO_URI=mongodb://admin:adminpassword@mongodb:27017/operation_db?authSource=admin
    volumes:
      - ./operation-service:/app
      - /app/node_modules
    depends_on:
      - mongodb

volumes:
  identity_pgdata:
  inventory_pgdata:
  auth_pgdata:
  notification_pgdata:
  analytics_pgdata:
  mongodb_data: