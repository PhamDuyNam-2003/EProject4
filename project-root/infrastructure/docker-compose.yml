version: '3.8'

services:
  # ------------------------------------------------
  # 1. POSTGRESQL (Core Relational DB)
  # ------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: hotel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      # Tạo mặc định một db, các db khác sẽ phải tạo thêm thông qua script hoặc pgAdmin
      POSTGRES_DB: default_db 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hotel_network

  # Giao diện quản lý Postgres trên Web (Truy cập: localhost:5050)
  pgadmin:
    image: dpage/pgadmin4
    container_name: hotel_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hotel.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - hotel_network

  # ------------------------------------------------
  # 2. MONGODB (NoSQL DB cho Chat & Review)
  # ------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: hotel_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - hotel_network

  # Giao diện quản lý Mongo trên Web (Truy cập: localhost:8081)
  mongo-express:
    image: mongo-express
    container_name: hotel_mongoexpress
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: adminpassword
      ME_CONFIG_MONGODB_URL: mongodb://admin:adminpassword@mongodb:27017/
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - hotel_network

  # ------------------------------------------------
  # 3. REDIS (Caching & Lock)
  # ------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hotel_network

  # Giao diện quản lý Redis (Truy cập: localhost:8001)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: hotel_redis_commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8001:8081"
    depends_on:
      - redis
    networks:
      - hotel_network

  # ------------------------------------------------
  # 4. RABBITMQ (Message Broker)
  # ------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hotel_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: adminpassword
    ports:
      - "5672:5672"   # Port cho code gọi vào
      - "15672:15672" # Giao diện Web (Truy cập: localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - hotel_network

  # ------------------------------------------------
  # 5. ELASTICSEARCH (Tìm kiếm)
  # ------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: hotel_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - hotel_network

# Định nghĩa Volumes để dữ liệu không bị mất khi tắt Docker
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  elastic_data:

# Mạng nội bộ cho các container giao tiếp với nhau
networks:
  hotel_network:
    driver: bridge